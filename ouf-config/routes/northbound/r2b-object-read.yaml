apiVersion: ouf.trieste.it/v1
kind: RouteBinding
metadata:
  id: r2b-object-read
  version: 1.0.0
  status: ACTIVE
spec:
  direction: northbound
  exposure: public
  capabilityRef: urban.object.read@1.0.0
  sourceRef: r2b-udp@1.0.0
  match:
    method: GET
    path: /api/udp/v1/objects/*
  backendBinding:
    service: ouf-udp-object-resolution
    port: 8080
    path: /api/udp/v1/objects/*
  policy:
    identity: OIDC
    maxRequestBytes: 65536
    timeoutSeconds: 10
