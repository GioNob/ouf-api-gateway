apiVersion: ouf.trieste.it/v1
kind: RouteBinding
metadata:
  id: trusted-human-onboarding-approvals-post
  version: 1.0.0
  status: ACTIVE
spec:
  direction: northbound
  exposure: public
  capabilityRef: ouf.onboarding.configuration.write@1.0.0
  sourceRef: r2b-onboarding@1.0.0
  match:
    method: POST
    path: /api/trusted-human/v1/approval-challenges/*
  backendBinding:
    service: ouf-onboarding
    port: 8080
    path: /api/trusted-human/v1/approval-challenges/*
  policy:
    identity: OIDC
    allowedActorTypes: [HUMAN]
    maxRequestBytes: 65536
    timeoutSeconds: 10
