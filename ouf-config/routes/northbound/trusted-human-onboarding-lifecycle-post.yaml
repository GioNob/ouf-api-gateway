apiVersion: ouf.trieste.it/v1
kind: RouteBinding
metadata:
  id: trusted-human-onboarding-lifecycle-post
  version: 1.0.0
  status: ACTIVE
spec:
  direction: northbound
  exposure: public
  capabilityRef: ouf.onboarding.configuration.write@1.0.0
  sourceRef: r2b-onboarding@1.0.0
  match:
    method: POST
    path: /api/onboarding/v1/sources/*
  backendBinding:
    service: ouf-onboarding
    port: 8080
    path: /api/onboarding/v1/sources/*
  policy:
    identity: OIDC
    allowedActorTypes: [HUMAN]
    maxRequestBytes: 5242880
    timeoutSeconds: 10
