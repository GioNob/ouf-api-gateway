apiVersion: ouf.trieste.it/v1
kind: RouteBinding
metadata: {id: mcp-operations-summary, version: 1.0.0, status: ACTIVE}
spec:
  direction: northbound
  exposure: internal
  capabilityRef: ouf.operations.summary@1.0.0
  sourceRef: mcp-server-operations@1.0.0
  match: {method: POST, path: /internal/capabilities/v1/execute/ouf.operations.summary}
  backendBinding: {service: ouf-mcp-server, port: 8080, path: /api/internal/v1/mcp/operations/summary}
  policy:
    identity: M2M
    allowedServiceIdentities: [installation://iam.workloadClients.mcpServer]
    allowedActorTypes: [HUMAN]
    maxRequestBytes: 65536
    timeoutSeconds: 5
