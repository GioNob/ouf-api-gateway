apiVersion: ouf.trieste.it/v1
kind: RouteBinding
metadata:
  id: onboarding-managed-file-read
  version: 1.0.0
  status: ACTIVE
spec:
  direction: northbound
  exposure: internal
  capabilityRef: ouf.object-storage.content.read@1.0.0
  sourceRef: onboarding-managed-files@1.0.0
  match:
    method: GET
    path: /internal/object-storage/v1/content
    query:
      ref:
        required: true
        pattern: ^object://[a-z0-9._/-]+$
  backendBinding:
    service: ouf-onboarding
    port: 8080
    path: /api/internal/v1/onboarding/managed-files/content
  policy:
    identity: M2M
    allowedServiceIdentities:
    - ouf-onboarding
    - installation://iam.workloadClients.ingestion
    allowedActorTypes:
    - SERVICE
    maxRequestBytes: 10485760
    timeoutSeconds: 10
