apiVersion: ouf.trieste.it/v1
kind: RouteBinding
metadata: {id: api-system-status, version: 1.0.0, status: ACTIVE}
spec:
  direction: northbound
  exposure: public
  capabilityRef: ouf.system.status@1.0.0
  sourceRef: mcp-server-operations@1.0.0
  match: {method: POST, path: /api/v1/operations/system/status}
  backendBinding: {service: ouf-mcp-server, port: 8080, path: /api/internal/v1/mcp/operations/status}
  policy:
    identity: OIDC
    allowedActorTypes: [HUMAN]
    maxRequestBytes: 65536
    timeoutSeconds: 3
