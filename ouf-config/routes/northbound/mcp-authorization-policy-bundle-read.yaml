apiVersion: ouf.trieste.it/v1
kind: RouteBinding
metadata:
  id: mcp-authorization-policy-bundle-read
  version: 1.0.0
  status: ACTIVE
spec:
  direction: northbound
  exposure: internal
  capabilityRef: authorization.bundle.read@1.0.0
  sourceRef: r2b-onboarding@1.0.0
  match:
    method: GET
    path: /internal/capabilities/v1/authorization/policy-bundle/active
  backendBinding:
    service: ouf-onboarding
    port: 8080
    path: /api/internal/v1/authorization/policy-bundle/active
  policy:
    identity: M2M
    allowedServiceIdentities:
      - installation://iam.workloadClients.mcpServer
      - installation://iam.workloadClients.ingestion
      - installation://iam.workloadClients.udp
      - installation://iam.workloadClients.semantic
    allowedActorTypes:
      - SERVICE
    maxRequestBytes: 65536
    timeoutSeconds: 5
