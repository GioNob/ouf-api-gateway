apiVersion: ouf.trieste.it/v1
kind: RouteBinding
metadata: {id: ths-resolution-package-read, version: 1.0.0, status: ACTIVE}
spec:
  direction: northbound
  exposure: public
  capabilityRef: resolution.issue.read@1.0.0
  sourceRef: r2b-udp@1.0.0
  match: {method: GET, path: /api/udp/v1/governance/resolution/issues/package}
  backendBinding: {service: ouf-udp-object-resolution, port: 8080, path: /api/udp/v1/governance/resolution/issues/package}
  policy:
    identity: OIDC
    allowedActorTypes: [HUMAN]
    maxRequestBytes: 65536
    timeoutSeconds: 10
