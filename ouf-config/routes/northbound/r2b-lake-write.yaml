apiVersion: ouf.trieste.it/v1
kind: RouteBinding
metadata:
  id: r2b-lake-write
  version: 1.0.0
  status: ACTIVE
spec:
  direction: northbound
  exposure: internal
  capabilityRef: datalake.write@1.0.0
  sourceRef: r2b-udp@1.0.0
  match:
    method: POST
    path: /api/internal/v1/lake/objects
  backendBinding:
    service: ouf-udp-object-resolution
    port: 8080
    path: /api/internal/v1/lake/objects
  policy:
    identity: M2M
    maxRequestBytes: 10485760
    timeoutSeconds: 10
    allowedServiceIdentities:
    - ouf-ingestion-runtime
    allowedActorTypes:
    - SERVICE
