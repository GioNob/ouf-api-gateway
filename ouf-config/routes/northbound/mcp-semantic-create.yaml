apiVersion: ouf.trieste.it/v1
kind: RouteBinding
metadata:
  id: mcp-semantic-create
  version: 1.0.0
  status: ACTIVE
spec:
  direction: northbound
  exposure: internal
  capabilityRef: ouf.semantic.propose@1.0.0
  sourceRef: r2b-semantic@1.0.0
  match:
    method: POST
    path: /internal/capabilities/v1/execute/ouf.semantic.propose
  backendBinding:
    service: ouf-semantic-registry
    port: 8080
    path: /api/semantic/v1/proposal-commands/create
  policy:
    identity: M2M
    allowedServiceIdentities:
    - installation://iam.workloadClients.mcpServer
    allowedActorTypes:
    - HUMAN
    - AI_AGENT
    - SERVICE
    maxRequestBytes: 65536
    timeoutSeconds: 3
