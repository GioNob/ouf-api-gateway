apiVersion: ouf.trieste.it/v1
kind: RouteBinding
metadata: {id: mcp-gateway-operations-summary, version: 1.0.0, status: ACTIVE}
spec:
  direction: northbound
  exposure: internal
  capabilityRef: ouf.gateway.operations.summary@1.0.0
  sourceRef: gateway-control-plane-operations@1.0.0
  match: {method: POST, path: /internal/capabilities/v1/execute/ouf.gateway.operations.summary}
  backendBinding: {service: ouf-gateway-control-plane, port: 8081, path: /api/internal/v1/gateway/operations/summary}
  policy:
    identity: M2M
    allowedServiceIdentities: [installation://iam.workloadClients.mcpServer]
    allowedActorTypes: [HUMAN]
    maxRequestBytes: 65536
    timeoutSeconds: 3
