apiVersion: ouf.trieste.it/v1
kind: RouteBinding
metadata: {id: mcp-system-status, version: 1.0.0, status: ACTIVE}
spec:
  direction: northbound
  exposure: internal
  capabilityRef: ouf.system.status@1.0.0
  sourceRef: mcp-server-operations@1.0.0
  match: {method: POST, path: /internal/capabilities/v1/execute/ouf.system.status}
  backendBinding: {service: ouf-mcp-server, port: 8080, path: /api/internal/v1/mcp/operations/status}
  policy:
    identity: M2M
    allowedServiceIdentities: [ouf-mcp-server]
    allowedActorTypes: [HUMAN, SERVICE]
    maxRequestBytes: 65536
    timeoutSeconds: 3
