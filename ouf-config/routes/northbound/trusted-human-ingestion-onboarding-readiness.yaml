apiVersion: ouf.trieste.it/v1
kind: RouteBinding
metadata: {id: trusted-human-ingestion-onboarding-readiness, version: 1.0.0, status: ACTIVE}
spec:
  direction: northbound
  exposure: public
  capabilityRef: ouf.onboarding.configuration.write@1.0.0
  sourceRef: ingestion-runtime-operations@1.0.0
  match:
    method: POST
    path: /api/trusted-human/v1/ingestion/onboarding-readiness
  backendBinding:
    service: ouf-ingestion-runtime
    port: 8080
    path: /api/trusted-human/v1/ingestion/onboarding-readiness
  policy:
    identity: OIDC
    allowedActorTypes: [HUMAN]
    maxRequestBytes: 65536
    timeoutSeconds: 35
