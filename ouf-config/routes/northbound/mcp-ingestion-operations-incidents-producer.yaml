apiVersion: ouf.trieste.it/v1
kind: RouteBinding
metadata: {id: mcp-ingestion-operations-incidents-producer, version: 1.0.0, status: ACTIVE}
spec:
  direction: northbound
  exposure: internal
  capabilityRef: ouf.ingestion.operations.incidents@1.0.0
  sourceRef: ingestion-runtime-operations@1.0.0
  match: {method: POST, path: /internal/capabilities/v1/execute/ouf.ingestion.operations.incidents}
  backendBinding: {service: ouf-ingestion-runtime, port: 8080, path: /api/internal/v1/ingestion/operations/incidents}
  policy:
    identity: M2M
    allowedServiceIdentities: [installation://iam.workloadClients.mcpServer]
    allowedActorTypes: [HUMAN]
    maxRequestBytes: 65536
    timeoutSeconds: 3
