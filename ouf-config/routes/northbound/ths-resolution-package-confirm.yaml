apiVersion: ouf.trieste.it/v1
kind: RouteBinding
metadata: {id: ths-resolution-package-confirm, version: 1.0.0, status: ACTIVE}
spec:
  direction: northbound
  exposure: public
  capabilityRef: resolution.match.approve@1.0.0
  sourceRef: r2b-udp@1.0.0
  match: {method: POST, path: /api/udp/v1/governance/resolution/issues/package/confirm}
  backendBinding: {service: ouf-udp-object-resolution, port: 8080, path: /api/udp/v1/governance/resolution/issues/package/confirm}
  policy:
    identity: OIDC
    allowedActorTypes: [HUMAN]
    maxRequestBytes: 1048576
    timeoutSeconds: 20
