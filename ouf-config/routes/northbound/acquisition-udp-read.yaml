apiVersion: ouf.trieste.it/v1
kind: RouteBinding
metadata: {id: acquisition-udp-read, version: 1.0.0, status: ACTIVE}
spec:
  direction: northbound
  exposure: internal
  capabilityRef: urban.acquisition.read@1.0.0
  sourceRef: acquisition-udp-read@1.0.0
  match: {method: POST, path: /internal/capabilities/v1/execute/urban.acquisition.read}
  backendBinding: {service: ouf-udp-evidence-read, port: 8080, path: /api/udp/v1/operations/acquisition}
  policy:
    identity: M2M
    allowedServiceIdentities: [installation://iam.workloadClients.mcpServer]
    allowedActorTypes: [HUMAN]
    maxRequestBytes: 65536
    timeoutSeconds: 12
