apiVersion: ouf.trieste.it/v1
kind: RouteBinding
metadata:
  id: trusted-human-authorization-capabilities-register
  version: 1.0.0
  status: ACTIVE
spec:
  direction: northbound
  exposure: public
  capabilityRef: authorization.policy.admin@1.0.0
  sourceRef: r2b-onboarding@1.0.0
  match:
    method: POST
    path: /api/trusted-human/v1/authorization/capabilities
  backendBinding:
    service: ouf-onboarding
    port: 8080
    path: /api/trusted-human/v1/authorization/capabilities
  policy:
    identity: OIDC
    allowedActorTypes:
      - HUMAN
    maxRequestBytes: 65536
    timeoutSeconds: 5
