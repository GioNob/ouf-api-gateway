apiVersion: ouf.trieste.it/v1
kind: RouteBinding
metadata: {id: trusted-human-ingestion-run-resume, version: 1.0.0, status: ACTIVE}
spec:
  direction: northbound
  exposure: public
  capabilityRef: ingestion.run.resume@1.0.0
  sourceRef: ingestion-runtime-operations@1.0.0
  match:
    method: POST
    path: /api/trusted-human/v1/ingestion/runs/*
    uriRegex: '^/api/trusted-human/v1/ingestion/runs/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/resume$'
  backendBinding:
    service: ouf-ingestion-runtime
    port: 8080
    path: /api/trusted-human/v1/ingestion/runs/*
  policy:
    identity: OIDC
    allowedActorTypes: [HUMAN]
    maxRequestBytes: 65536
    timeoutSeconds: 15
