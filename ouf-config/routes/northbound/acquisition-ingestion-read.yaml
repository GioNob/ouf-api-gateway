apiVersion: ouf.trieste.it/v1
kind: RouteBinding
metadata: {id: acquisition-ingestion-read, version: 1.0.0, status: ACTIVE}
spec:
  direction: northbound
  exposure: internal
  capabilityRef: ouf.ingestion.acquisition.read@1.0.0
  sourceRef: ingestion-runtime-operations@1.0.0
  match: {method: POST, path: /internal/capabilities/v1/execute/ouf.ingestion.acquisition.read}
  backendBinding: {service: ouf-ingestion-evidence-read, port: 8080, path: /api/internal/v1/ingestion/operations/acquisition}
  policy:
    identity: M2M
    allowedServiceIdentities: [installation://iam.workloadClients.mcpServer]
    allowedActorTypes: [HUMAN]
    maxRequestBytes: 65536
    timeoutSeconds: 12
