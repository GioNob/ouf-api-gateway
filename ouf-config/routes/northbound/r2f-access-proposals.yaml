apiVersion: ouf.trieste.it/v1
kind: RouteBinding
metadata:
  id: r2f-access-proposals
  version: 1.0.0
  status: ACTIVE
spec:
  direction: northbound
  exposure: public
  capabilityRef: ouf.source-onboarding.semantic-gap.create@1.0.0
  sourceRef: r2b-onboarding@1.0.0
  match:
    method: POST
    path: /api/onboarding/v1/access-semantic-proposals
  backendBinding:
    service: ouf-source-onboarding
    port: 8080
    path: /api/onboarding/v1/access-semantic-proposals
  policy:
    identity: OIDC
    maxRequestBytes: 65536
    timeoutSeconds: 10
