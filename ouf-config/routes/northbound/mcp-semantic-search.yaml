apiVersion: ouf.trieste.it/v1
kind: RouteBinding
metadata: {id: mcp-semantic-search, version: 1.0.0, status: ACTIVE}
spec:
  direction: northbound
  exposure: internal
  capabilityRef: ouf.semantic.search@1.0.0
  sourceRef: r2b-semantic@1.0.0
  match: {method: POST, path: /internal/capabilities/v1/execute/semantic/search}
  backendBinding: {service: ouf-semantic-registry, port: 8080, path: /api/internal/v1/semantic/consultation/search}
  policy:
    identity: M2M
    allowedServiceIdentities: [installation://iam.workloadClients.mcpServer]
    allowedActorTypes: [HUMAN]
    maxRequestBytes: 65536
    timeoutSeconds: 3
