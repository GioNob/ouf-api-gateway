apiVersion: ouf.trieste.it/v1
kind: RouteBinding
metadata: {id: mcp-analysis-mandate-renewal-check, version: 1.0.0, status: ACTIVE}
spec:
  direction: northbound
  exposure: internal
  capabilityRef: ouf.analysis.mandate.renewal-check@1.0.0
  sourceRef: gateway-analysis-mandates@1.0.0
  match:
    method: POST
    path: /internal/analysis/v1/mandates/renewal-check
  backendBinding: {service: ouf-gateway-analysis-mandates, port: 8443, path: /internal/analysis/v1/mandates/renewal-check}
  policy:
    identity: M2M
    allowedServiceIdentities: [installation://iam.workloadClients.mcpServer]
    allowedActorTypes: [SERVICE]
    maxRequestBytes: 131072
    timeoutSeconds: 30
