apiVersion: ouf.trieste.it/v1
kind: RouteBinding
metadata:
  id: semantic-human-terms
  version: 1.0.0
  status: ACTIVE
spec:
  direction: northbound
  exposure: public
  capabilityRef: ouf.semantic.review@1.0.0
  sourceRef: r2b-semantic@1.0.0
  match:
    method: GET
    path: /api/trusted-human/v1/semantic-published-terms
    uriRegex: ^/api/trusted-human/v1/semantic-published-terms$
  backendBinding:
    service: ouf-semantic-registry
    port: 8080
    path: /api/trusted-human/v1/semantic-published-terms
  policy:
    identity: OIDC
    allowedActorTypes:
    - HUMAN
    maxRequestBytes: 65536
    timeoutSeconds: 10
