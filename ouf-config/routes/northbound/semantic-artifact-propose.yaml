apiVersion: ouf.trieste.it/v1
kind: RouteBinding
metadata:
  id: semantic-artifact-propose
  version: 1.0.0
  status: ACTIVE
spec:
  direction: northbound
  exposure: public
  capabilityRef: ouf.semantic.propose@1.0.0
  sourceRef: r2b-semantic@1.0.0
  match:
    method: POST
    path: /api/semantic/v1/artifacts
  backendBinding:
    service: ouf-semantic-registry
    port: 8080
    path: /api/semantic/v1/artifacts
  policy:
    identity: OIDC
    allowedActorTypes:
    - HUMAN
    maxRequestBytes: 65536
    timeoutSeconds: 10
