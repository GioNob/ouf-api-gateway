apiVersion: ouf.trieste.it/v1
kind: RouteBinding
metadata: {id: api-operations-summary, version: 1.0.0, status: ACTIVE}
spec:
  direction: northbound
  exposure: public
  capabilityRef: ouf.operations.summary@1.0.0
  sourceRef: mcp-server-operations@1.0.0
  match: {method: POST, path: /api/v1/operations/summary}
  backendBinding: {service: ouf-mcp-server, port: 8080, path: /api/internal/v1/mcp/operations/summary}
  policy:
    identity: OIDC
    allowedActorTypes: [HUMAN_USER]
    maxRequestBytes: 65536
    timeoutSeconds: 5
