apiVersion: ouf.trieste.it/v1
kind: RouteBinding
metadata: {id: trusted-human-analysis-renewal-read, version: 1.0.0, status: ACTIVE}
spec:
  direction: northbound
  exposure: public
  capabilityRef: ouf.analysis.renewal.read@1.0.0
  sourceRef: r2b-onboarding@1.0.0
  match:
    method: GET
    path: /trusted-human/analysis-renewal/*
    uriRegex: '^/trusted-human/analysis-renewal/(?:[A-Za-z0-9_-]{22,128}|(?:[A-Za-z0-9_~-][A-Za-z0-9._~-]*/)*[A-Za-z0-9_~-][A-Za-z0-9._~-]*\.(?:js|css))$'
  backendBinding: {service: ouf-onboarding, port: 8080, path: /trusted-human/analysis-renewal/*}
  policy:
    identity: OIDC
    allowedActorTypes: [HUMAN]
    maxRequestBytes: 131072
    timeoutSeconds: 30
