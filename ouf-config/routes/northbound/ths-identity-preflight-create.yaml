apiVersion: ouf.trieste.it/v1
kind: RouteBinding
metadata: {id: ths-identity-preflight-create, version: 1.0.0, status: ACTIVE}
spec:
  direction: northbound
  exposure: public
  capabilityRef: urban.identity.preflight@1.0.0
  sourceRef: r2b-udp@1.0.0
  match: {method: POST, path: /api/udp/v1/governance/identity/preflight}
  backendBinding: {service: ouf-udp-object-resolution, port: 8080, path: /api/udp/v1/governance/identity/preflight}
  policy:
    identity: OIDC
    allowedActorTypes: [HUMAN]
    maxRequestBytes: 2097152
    timeoutSeconds: 60
