apiVersion: ouf.trieste.it/v1
kind: RouteBinding
metadata: {id: mcp-onboarding-schema-notices-read, version: 1.0.0, status: ACTIVE}
spec:
  direction: northbound
  exposure: internal
  capabilityRef: ouf.onboarding.schema-notices.read@1.0.0
  sourceRef: r2b-onboarding@1.0.0
  match: {method: POST, path: /internal/capabilities/v1/execute/ouf.onboarding.schema-notices.read}
  # Logical service and local development port; supply the backend binding for each installation.
  backendBinding: {service: ouf-onboarding, port: 8080, path: /api/onboarding/v1/schema-notices}
  policy:
    identity: M2M
    allowedServiceIdentities: [installation://iam.workloadClients.mcpServer]
    allowedActorTypes: [HUMAN]
    maxRequestBytes: 65536
    timeoutSeconds: 3
