apiVersion: ouf.trieste.it/v1
kind: RouteBinding
metadata: {id: r4a-onboarding-ingestion-compatibility-read, version: 1.0.0, status: ACTIVE}
spec:
  direction: northbound
  exposure: internal
  capabilityRef: ouf.onboarding.configuration.read@1.0.0
  sourceRef: r2b-onboarding@1.0.0
  match:
    method: GET
    path: /api/internal/v1/onboarding/compatibility/ingestion-runtime
    query:
      type: object
      required: [sourceId, onboardingVersionId, configurationHash]
      additionalProperties: false
      properties:
        sourceId: {type: string, minLength: 1, maxLength: 160}
        onboardingVersionId: {type: string, format: uuid}
        configurationHash: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
  backendBinding:
    service: ouf-onboarding
    port: 8080
    path: /api/internal/v1/onboarding/compatibility/ingestion-runtime
  policy:
    identity: M2M
    allowedServiceIdentities: [installation://iam.workloadClients.ingestion]
    allowedActorTypes: [SERVICE]
    maxRequestBytes: 65536
    timeoutSeconds: 10
