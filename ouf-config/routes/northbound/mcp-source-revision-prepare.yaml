apiVersion: ouf.trieste.it/v1
kind: RouteBinding
metadata: {id: mcp-source-revision-prepare, version: 1.0.0, status: ACTIVE}
spec:
  direction: northbound
  exposure: internal
  capabilityRef: ouf.onboarding.revision.prepare@1.0.0
  sourceRef: r2b-onboarding@1.0.0
  match: {method: POST, path: /internal/capabilities/v1/execute/source.revision/prepare}
  backendBinding: {service: ouf-onboarding, port: 8080, path: /api/internal/v1/onboarding/source-revision-mcp/prepare}
  policy:
    identity: M2M
    allowedServiceIdentities: [installation://iam.workloadClients.mcpServer]
    allowedActorTypes: [HUMAN]
    maxRequestBytes: 65536
    timeoutSeconds: 10
