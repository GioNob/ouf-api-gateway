apiVersion: ouf.trieste.it/v1
kind: RouteBinding
metadata:
  id: r2b-semantic-reference-batch
  version: 1.0.0
  status: ACTIVE
spec:
  direction: northbound
  exposure: internal
  capabilityRef: ouf.semantic.read@1.0.0
  sourceRef: r2b-semantic@1.0.0
  match:
    method: POST
    path: /api/semantic/v1/references:resolve-batch
  backendBinding:
    service: ouf-semantic-registry
    port: 8080
    path: /api/semantic/v1/references:resolve-batch
  policy:
    identity: M2M
    maxRequestBytes: 262144
    timeoutSeconds: 10
    allowedServiceIdentities:
    - installation://iam.workloadClients.ingestion
    - installation://iam.workloadClients.udp
    allowedActorTypes:
    - SERVICE_IDENTITY
