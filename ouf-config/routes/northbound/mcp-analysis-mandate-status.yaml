apiVersion: ouf.trieste.it/v1
kind: RouteBinding
metadata: {id: mcp-analysis-mandate-status, version: 1.0.0, status: ACTIVE}
spec:
  direction: northbound
  exposure: internal
  capabilityRef: ouf.analysis.mandate.status@1.0.0
  sourceRef: gateway-analysis-mandates@1.0.0
  match: {method: POST, path: /internal/analysis/v1/mandates/status}
  backendBinding: {service: ouf-gateway-analysis-mandates, port: 8443, path: /internal/analysis/v1/mandates/status}
  policy:
    identity: M2M
    allowedServiceIdentities: [installation://iam.workloadClients.mcpServer]
    allowedActorTypes: [SERVICE]
    maxRequestBytes: 1024
    timeoutSeconds: 30
