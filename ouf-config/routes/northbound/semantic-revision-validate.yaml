apiVersion: ouf.trieste.it/v1
kind: RouteBinding
metadata:
  id: semantic-revision-validate
  version: 1.0.0
  status: ACTIVE
spec:
  direction: northbound
  exposure: public
  capabilityRef: ouf.semantic.review.prepare@1.0.0
  sourceRef: r2b-semantic@1.0.0
  match:
    method: POST
    path: /api/semantic/v1/revisions/*
    uriRegex: ^/api/semantic/v1/revisions/[0-9a-fA-F-]{36}:validate$
  backendBinding:
    service: ouf-semantic-registry
    port: 8080
    path: /api/semantic/v1/revisions/*
  policy:
    identity: OIDC
    allowedActorTypes:
    - HUMAN
    maxRequestBytes: 65536
    timeoutSeconds: 10
