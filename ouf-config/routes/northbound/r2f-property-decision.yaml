apiVersion: ouf.trieste.it/v1
kind: RouteBinding
metadata:
  id: r2f-property-decision
  version: 1.0.0
  status: ACTIVE
spec:
  direction: northbound
  exposure: public
  capabilityRef: authority.override@1.0.0
  sourceRef: r2b-udp@1.0.0
  match:
    method: POST
    path: /api/udp/v1/governance/properties/conflicts/*
  backendBinding:
    service: ouf-udp-object-resolution
    port: 8080
    path: /api/udp/v1/governance/properties/conflicts/*
  policy:
    identity: OIDC
    maxRequestBytes: 65536
    timeoutSeconds: 10
    allowedActorTypes:
    - HUMAN_USER
