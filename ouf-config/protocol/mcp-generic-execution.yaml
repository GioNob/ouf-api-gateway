apiVersion: ouf.trieste.it/v1
kind: McpMediationBinding
metadata:
  id: mcp-generic-execution
  version: 1.0.0
  status: ACTIVE
spec:
  mode: EXECUTION
  match:
    method: POST
    path: /internal/capabilities/v1/execute
  policy:
    identity: M2M
    serviceIdentityRef: installation://iam.workloadClients.mcpServer
    requiredScope: null
    maxRequestBytes: 1048576
    timeoutSeconds: 5
