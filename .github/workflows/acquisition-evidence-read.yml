name: Composed acquisition evidence read receipts
on:
  push:
    branches: [feat/acquisition-evidence-read-20261025]
  pull_request:
    paths: ['tools/materialize_acquisition_read.py','tools/lua/execute_acquisition_read.lua','tools/delegation_functions.py','tests/test_acquisition_read.py','ouf-config/**acquisition**','ouf-config/**/acquisition-*.yaml','.github/workflows/acquisition-evidence-read.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  lua-and-native-owner-verifiers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: GioNob/ouf-ingestion-runtime, ref: 89f8f5b6b2fc40523f04e96f9be2c9c11f54993d, path: .pairwise/ingestion}
      - uses: actions/checkout@v4
        with: {repository: GioNob/ouf-udp-object-resolution, ref: 3ff4fd1b73880fcc30497a98cf39cc197dd7489f, path: .pairwise/udp}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: pip install -r requirements-dev.txt
      - name: Compile and exercise closed additive mediation and actual generated Lua
        run: python3 -m pytest -q tests/test_acquisition_read.py tests/test_ingestion_read_materialization.py
      - name: Export actual Gateway Lua receipts, no synthetic signer
        run: mkdir -p target && python3 -m tests.test_acquisition_read "$GITHUB_WORKSPACE/target/acquisition-vectors.json"
      - name: Verify exact receipts in the pinned Java owners
        env:
          OUF_ACQUISITION_VECTORS: ${{ github.workspace }}/target/acquisition-vectors.json
        run: |
          (cd .pairwise/ingestion && bash scripts/install-authorization-sdk.sh && mvn -B -ntp -Dtest=AcquisitionReceiptPairwiseTest test)
          (cd .pairwise/udp && bash scripts/install-authorization-sdk.sh && mvn -B -ntp -Dtest=AcquisitionReceiptPairwiseTest test)
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acquisition-composed-receipts-${{ github.run_id }}
          path: |
            target/acquisition-vectors.json
            .pairwise/ingestion/target/surefire-reports/
            .pairwise/udp/target/surefire-reports/
          retention-days: 30
