name: Semantic provider request boundary
on:
  push:
    paths:
      - 'Dockerfile.semantic-provider'
      - 'scripts/stage_semantic_provider_adapter.py'
      - 'scripts/inventory_semantic_provider_network.py'
      - 'scripts/prepare_semantic_provider_networks.py'
      - 'tests/test_prepare_semantic_provider_networks.py'
      - 'scripts/prepare_semantic_provider_trust.py'
      - 'scripts/prepare_semantic_provider_tls_runtime.py'
      - 'tests/test_prepare_semantic_provider_tls_runtime.py'
      - 'examples/semantic-provider-runtime.ouf-lab.json'
      - 'scripts/stage_semantic_provider_runtime_plan.sh'
      - 'tests/test_prepare_semantic_provider_trust.py'
      - 'tools/materialize_southbound_kernel.py'
      - 'tools/materialize_southbound_lease_refresh.py'
      - 'tests/test_southbound_kernel.py'
      - 'tests/test_southbound_docker_kernel.py'
      - 'tests/test_stage_semantic_provider_adapter.py'
      - 'tools/semantic_provider_*.py'
      - 'tools/materialize_semantic_provider.py'
      - 'tools/materialize_semantic_provider_runtime.py'
      - 'tools/materialize_semantic_provider_tls.py'
      - 'tools/lua/admit_semantic_provider.lua'
      - 'tests/test_semantic_provider_*.py'
      - '.github/workflows/semantic-provider-boundary.yml'
      - 'scripts/prepare_semantic_provider_java_trust.py'
      - 'scripts/inventory_semantic_provider_dns.py'
      - 'tests/test_prepare_semantic_provider_java_trust.py'
  pull_request:
    paths:
      - 'Dockerfile.semantic-provider'
      - 'scripts/stage_semantic_provider_adapter.py'
      - 'scripts/inventory_semantic_provider_network.py'
      - 'scripts/prepare_semantic_provider_networks.py'
      - 'tests/test_prepare_semantic_provider_networks.py'
      - 'scripts/prepare_semantic_provider_trust.py'
      - 'scripts/prepare_semantic_provider_tls_runtime.py'
      - 'tests/test_prepare_semantic_provider_tls_runtime.py'
      - 'examples/semantic-provider-runtime.ouf-lab.json'
      - 'scripts/stage_semantic_provider_runtime_plan.sh'
      - 'tests/test_prepare_semantic_provider_trust.py'
      - 'tools/materialize_southbound_kernel.py'
      - 'tests/test_southbound_kernel.py'
      - 'tests/test_southbound_docker_kernel.py'
      - 'tests/test_stage_semantic_provider_adapter.py'
      - 'tools/semantic_provider_*.py'
      - 'tools/materialize_semantic_provider.py'
      - 'tools/materialize_semantic_provider_runtime.py'
      - 'tools/materialize_semantic_provider_tls.py'
      - 'tools/lua/admit_semantic_provider.lua'
      - 'tests/test_semantic_provider_*.py'
      - '.github/workflows/semantic-provider-boundary.yml'
permissions:
  contents: read
jobs:
  request-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - run: python3 -B -m unittest discover -s tests -p 'test_semantic_provider_*.py'

  provider-apisix-tls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - run: python3 -B -m unittest tests.test_semantic_provider_apisix_live
        env:
          OUF_SEMANTIC_PROVIDER_APISIX_TEST: '1'

  provider-image-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo env OUF_STAGE_ROOT_FIXTURE_PARENT=/root "$(command -v python3)" -B -m unittest tests.test_stage_semantic_provider_adapter

  provider-container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - run: python3 -B -m unittest tests.test_semantic_provider_container
        env:
          OUF_PROVIDER_CONTAINER_TEST: '1'
      - run: python3 -B -m unittest tests.test_semantic_provider_network_inventory
        env:
          OUF_PROVIDER_NETWORK_TEST: '1'
          OUF_PROVIDER_NETWORK_TEST_IMAGE: 'python@sha256:bb2988715db2cf7ace7b53f38f3cffbef7c7046a656bee66245eb0ed386e2e81'
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-provider-package-proof-${{ github.run_id }}
          path: generated/semantic-provider-package-proof.json
          if-no-files-found: error
          retention-days: 30

  southbound-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y nftables iproute2
      - run: sudo env OUF_SOUTHBOUND_KERNEL_TEST=1 "$(command -v python3)" -B -m unittest tests.test_southbound_kernel

      - run: docker pull python@sha256:bb2988715db2cf7ace7b53f38f3cffbef7c7046a656bee66245eb0ed386e2e81
      - run: sudo env OUF_SOUTHBOUND_DOCKER_KERNEL_TEST=1 OUF_SOUTHBOUND_DOCKER_KERNEL_IMAGE=python@sha256:bb2988715db2cf7ace7b53f38f3cffbef7c7046a656bee66245eb0ed386e2e81 "$(command -v python3)" -B -m unittest tests.test_southbound_docker_kernel

      - run: sudo env OUF_COLD_NETWORK_TEST=1 OUF_COLD_NETWORK_IMAGE=python@sha256:bb2988715db2cf7ace7b53f38f3cffbef7c7046a656bee66245eb0ed386e2e81 "$(command -v python3)" -B -m unittest tests.test_prepare_semantic_provider_networks

  provider-trust-prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo env OUF_TRUST_ROOT_FIXTURE_PARENT=/root OUF_TRUST_FULL_OWNER_TEST=1 "$(command -v python3)" -B -m unittest tests.test_prepare_semantic_provider_trust
      - run: sudo env OUF_RUNTIME_STAGE_TEST_PARENT=/root "$(command -v python3)" -B -m unittest tests.test_semantic_provider_runtime_stage
      - run: sudo env OUF_TRUST_ROOT_FIXTURE_PARENT=/root OUF_TRUST_FULL_OWNER_TEST=1 "$(command -v python3)" -B -m unittest tests.test_prepare_semantic_provider_tls_runtime
      - run: sudo env OUF_DNS_ROOT_FIXTURE_PARENT=/root "$(command -v python3)" -B -m unittest tests.test_semantic_provider_dns

  semantic-java-trust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: docker pull eclipse-temurin:21-jre
      - run: sudo env OUF_TRUST_ROOT_FIXTURE_PARENT=/root OUF_TRUST_FULL_OWNER_TEST=1 OUF_JAVA_TRUST_DOCKER_TEST=1 OUF_JAVA_TRUST_IMAGE=eclipse-temurin:21-jre PATH="$PATH" "$(command -v python3)" -B -m unittest tests.test_prepare_semantic_provider_java_trust
