name: Gateway control-plane and MCP mediation
on: [push, pull_request]
permissions: {contents: read}
jobs:
  config-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GioNob/ouf-source-onboarding
          ref: fb2dd51dfc204577a47c1e702f17531dd0709b3c
          path: .pairwise/authorization
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: PYTHONPATH="$PWD" AUTHORIZATION_PAIRWISE_ROOT="$PWD/.pairwise/authorization" pytest -q tests/test_authorization_gateway_pairwise.py
      - run: bash scripts/verify.sh
      - name: Real APISIX OIDC and delegation gate
        run: OUF_APISIX_LIVE_TEST=1 python3 -m pytest -q tests/test_execute_apisix_live.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-operational-awareness-evidence-${{ github.run_id }}
          path: |
            generated/
            config/runtime-catalog-v1.yaml
            docs/GATEWAY_1A_TRACEABILITY.md
            docs/GATEWAY_1B_TRACEABILITY.md
            docs/GATEWAY_1C_TRACEABILITY.md
            docs/GATEWAY_1D_TRACEABILITY.md
            docs/GATEWAY_1E_TRACEABILITY.md
            docs/GATEWAY_1F_TRACEABILITY.md
            docs/GATEWAY_1G_TRACEABILITY.md
            docs/GATEWAY_1G_B_TRACEABILITY.md
            docs/GATEWAY_1G_C_TRACEABILITY.md
            docs/GATEWAY_1G_D_TRACEABILITY.md
            docs/GATEWAY_1H_A_TRACEABILITY.md
            docs/GATEWAY_1H_BC_TRACEABILITY.md
            docs/GATEWAY_1H_D_TRACEABILITY.md
            docs/GATEWAY_1I_TRACEABILITY.md
            docs/GATEWAY_OPERATIONAL_AWARENESS_TRACEABILITY.md
            docs/GATEWAY_OPERATIONAL_AWARENESS_EXPLAIN_TRACEABILITY.md
            docs/GATEWAY_CHANNEL_NEUTRAL_OA_TRACEABILITY.md
            docs/GATEWAY_OPERATIONAL_AWARENESS_PRODUCER_TRACEABILITY.md
            docs/GATEWAY_AUTHORIZATION_PAIRWISE_TRACEABILITY.md
            docs/runbooks/etcd-restore.md
            helm/networkpolicy/
            helm/topology/gateway-ha.yaml
            ops/capacity-fixture-v1.yaml
            ops/observability-contract-v1.yaml
            ouf-config/capabilities/ouf.*.yaml
            ouf-config/source-runtime/ingestion-runtime-operations.yaml
            ouf-config/source-runtime/mcp-server-operations.yaml
            ouf-config/source-runtime/gateway-control-plane-operations.yaml
            ouf-config/routes/northbound/mcp-ingestion-*.yaml
            ouf-config/routes/northbound/mcp-operations-*.yaml
            ouf-config/routes/northbound/mcp-gateway-operations-*.yaml
            ouf-config/routes/northbound/mcp-system-status.yaml
            ouf-config/routes/northbound/api-system-status.yaml
            schemas/capability-manifest-v1.json
            schemas/gateway-publication-manifest-v1.json
            schemas/mcp-gateway-dispatch-v1.json
            schemas/mcp-gateway-recovery-v1.json
            schemas/mcp-evidence-ingress-v1.json
            tools/identity_boundary.py
            tools/authorization_boundary.py
            tools/operational_incidents.py
            tools/gateway_operational_api.py
            tools/publication.py
            tools/etcd_resilience.py
            tests/test_authorization_gateway_pairwise.py
            tests/test_identity_boundary.py
            tests/test_operational_awareness_routes.py
            tests/test_channel_neutral_system_status.py
            tests/test_gateway_operational_incidents.py
            tests/test_gateway_operational_owner_api.py
            tests/test_gateway_operational_routes.py
            tests/test_runtime_catalog_closure.py
            tests/test_etcd_resilience.py
            tests/test_gateway_ha_topology.py
            tests/test_gateway_ops_contract.py
            tests/test_apisix_control_plane.py
            tests/test_mcp_evidence_ingress.py
          retention-days: 30

  operational-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -r requirements-dev.txt
      - name: Verify pinned SDK and build authenticated producer
        run: |
          (cd vendor/authorization-sdk && sha256sum -c SOURCE_SHA256SUMS)
          mvn -B -ntp -f vendor/authorization-sdk/pom.xml install
          mvn -B -ntp -f operational-owner/pom.xml verify
      - name: Real APISIX to real Java producer with role revocation
        run: OUF_APISIX_LIVE_TEST=1 OUF_GATEWAY_OWNER_JAR="$PWD/operational-owner/target/gateway-operational-owner-1.0.0-SNAPSHOT.jar" python -m pytest -q tests/test_execute_apisix_live.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-owner-evidence-${{ github.run_id }}
          path: |
            operational-owner/target/surefire-reports/
            operational-owner/target/bom.json
