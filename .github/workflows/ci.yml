name: Gateway control-plane and MCP mediation
on: [push, pull_request]
permissions: {contents: read}
jobs:
  config-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: bash scripts/verify.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-1h-a-evidence-${{ github.run_id }}
          path: |
            generated/
            docs/GATEWAY_1A_TRACEABILITY.md
            docs/GATEWAY_1B_TRACEABILITY.md
            docs/GATEWAY_1C_TRACEABILITY.md
            docs/GATEWAY_1D_TRACEABILITY.md
            docs/GATEWAY_1E_TRACEABILITY.md
            docs/GATEWAY_1F_TRACEABILITY.md
            docs/GATEWAY_1G_TRACEABILITY.md
            docs/GATEWAY_1G_B_TRACEABILITY.md
            docs/GATEWAY_1G_C_TRACEABILITY.md
            docs/GATEWAY_1G_D_TRACEABILITY.md
            docs/GATEWAY_1H_A_TRACEABILITY.md
            helm/networkpolicy/
            helm/topology/gateway-ha.yaml
            schemas/gateway-publication-manifest-v1.json
            schemas/mcp-gateway-dispatch-v1.json
            schemas/mcp-gateway-recovery-v1.json
            schemas/mcp-evidence-ingress-v1.json
            tests/test_gateway_ha_topology.py
            tests/test_apisix_control_plane.py
            tests/test_mcp_evidence_ingress.py
          retention-days: 30
