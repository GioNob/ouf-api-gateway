name: Gateway 1C MCP capability binding
on: [push, pull_request]
permissions: {contents: read}
jobs:
  config-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: bash scripts/verify.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-1c-evidence-${{ github.run_id }}
          path: |
            generated/
            docs/GATEWAY_1A_TRACEABILITY.md
            docs/GATEWAY_1B_TRACEABILITY.md
            docs/GATEWAY_1C_TRACEABILITY.md
            schemas/gateway-publication-manifest-v1.json
            schemas/mcp-gateway-dispatch-v1.json
            tests/fixtures/mcp-related-search-dispatch.json
          retention-days: 30
