apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix-northbound
  namespace: ouf-gateway
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {ouf.component: apisix-northbound}
  template:
    metadata:
      labels: {ouf.component: apisix-northbound}
    spec:
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {ouf.component: apisix-northbound}
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: apisix
          image: apache/apisix:3.18.0-debian
          ports: [{containerPort: 9443}]
          readinessProbe: {httpGet: {path: /status/ready, port: 9443, scheme: HTTPS}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /status/live, port: 9443, scheme: HTTPS}, periodSeconds: 10}
          lifecycle:
            preStop:
              exec: {command: ["/bin/sh","-c","sleep 15"]}
          resources:
            requests: {cpu: "250m", memory: "256Mi"}
            limits: {cpu: "2", memory: "1Gi"}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: apisix-northbound, namespace: ouf-gateway}
spec:
  minReplicas: 3
  maxReplicas: 10
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: apisix-northbound}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: apisix-northbound, namespace: ouf-gateway}
spec:
  minAvailable: 2
  selector:
    matchLabels: {ouf.component: apisix-northbound}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: apisix-southbound, namespace: ouf-gateway}
spec:
  replicas: 2
  selector:
    matchLabels: {ouf.component: apisix-southbound}
  template:
    metadata:
      labels: {ouf.component: apisix-southbound}
    spec:
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {ouf.component: apisix-southbound}
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: apisix
          image: apache/apisix:3.18.0-debian
          ports: [{containerPort: 9443}]
          readinessProbe: {httpGet: {path: /status/ready, port: 9443, scheme: HTTPS}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /status/live, port: 9443, scheme: HTTPS}, periodSeconds: 10}
          lifecycle:
            preStop:
              exec: {command: ["/bin/sh","-c","sleep 15"]}
          resources:
            requests: {cpu: "250m", memory: "256Mi"}
            limits: {cpu: "2", memory: "1Gi"}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: apisix-southbound, namespace: ouf-gateway}
spec:
  minAvailable: 1
  selector:
    matchLabels: {ouf.component: apisix-southbound}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: apisix-control-plane, namespace: ouf-gateway}
spec:
  replicas: 2
  selector:
    matchLabels: {ouf.component: apisix-control-plane}
  template:
    metadata:
      labels: {ouf.component: apisix-control-plane}
    spec:
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: controller
          image: apache/apisix-ingress-controller:1.8.4
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "1", memory: "512Mi"}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: etcd, namespace: ouf-gateway}
spec:
  serviceName: etcd
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels: {ouf.component: etcd}
  template:
    metadata:
      labels: {ouf.component: etcd}
    spec:
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {ouf.component: etcd}
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.21
          ports: [{containerPort: 2379}, {containerPort: 2380}]
          readinessProbe: {tcpSocket: {port: 2379}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: 2379}, periodSeconds: 10}
          resources:
            requests: {cpu: "250m", memory: "512Mi"}
            limits: {cpu: "2", memory: "2Gi"}
