apiVersion: ouf.trieste.it/v1
kind: GatewayRuntimeConfigurationCatalog
version: "1.2"
entries:
  publication.batchSize: {type: integer, unit: objects, default: 50, minimum: 1, maximum: 1000, scope: control-plane, environmentScope: all, secretClassification: public, reload: restart}
  publication.convergenceTimeout: {type: duration, unit: seconds, default: 30, minimum: 1, maximum: 120, scope: control-plane, environmentScope: all, secretClassification: public, reload: restart}
  request.maxBytesCeiling: {type: integer, unit: bytes, default: 10485760, minimum: 1, maximum: 10485760, scope: data-plane, environmentScope: all, secretClassification: public, reload: publication}
  request.timeoutCeiling: {type: integer, unit: seconds, default: 60, minimum: 1, maximum: 60, scope: data-plane, environmentScope: all, secretClassification: public, reload: publication}
  rateLimit.defaultPerMinute: {type: integer, unit: requests/minute, default: 100, minimum: 1, maximum: 10000, scope: data-plane, environmentScope: all, secretClassification: public, reload: publication}
  semanticProvider.quota.ceiling: {type: integer, unit: requests/route/window, default: 20, minimum: 1, maximum: 20, scope: data-plane, environmentScope: installation, secretClassification: public, reload: publication}
  semanticProvider.quota.windowSeconds: {type: integer, unit: seconds, default: 60, minimum: 60, maximum: 60, scope: data-plane, environmentScope: installation, secretClassification: public, reload: publication}
  semanticProvider.originLifetimeSeconds: {type: integer, unit: seconds, default: 30, minimum: 1, maximum: 30, scope: data-plane, environmentScope: installation, secretClassification: public, reload: publication}
  semanticProvider.originKeyEnvironment: {type: string, unit: environment variable name, default: OUF_PROVIDER_429_ED25519_SEED, minimum: 2, maximum: 128, scope: data-plane, environmentScope: installation, secretClassification: reference, reload: restart}
  ha.northbound.replicas: {type: integer, unit: pods, default: 3, minimum: 3, maximum: 10, scope: deployment, environmentScope: all, secretClassification: public, reload: restart}
  ha.northbound.hpaMinReplicas: {type: integer, unit: pods, default: 3, minimum: 3, maximum: 10, scope: deployment, environmentScope: all, secretClassification: public, reload: restart}
  ha.northbound.hpaMaxReplicas: {type: integer, unit: pods, default: 10, minimum: 3, maximum: 10, scope: deployment, environmentScope: all, secretClassification: public, reload: restart}
  ha.northbound.cpuTargetUtilization: {type: integer, unit: percent, default: 70, minimum: 1, maximum: 100, scope: deployment, environmentScope: all, secretClassification: public, reload: restart}
  ha.northbound.pdbMinAvailable: {type: integer, unit: pods, default: 2, minimum: 1, maximum: 9, scope: deployment, environmentScope: all, secretClassification: public, reload: restart}
  ha.southbound.replicas: {type: integer, unit: pods, default: 2, minimum: 2, maximum: 10, scope: deployment, environmentScope: all, secretClassification: public, reload: restart}
  ha.southbound.pdbMinAvailable: {type: integer, unit: pods, default: 1, minimum: 1, maximum: 9, scope: deployment, environmentScope: all, secretClassification: public, reload: restart}
  ha.controlPlane.replicas: {type: integer, unit: pods, default: 2, minimum: 2, maximum: 10, scope: deployment, environmentScope: all, secretClassification: public, reload: restart}
  ha.etcd.members: {type: integer, unit: members, default: 3, minimum: 3, maximum: 7, scope: deployment, environmentScope: all, secretClassification: public, reload: restart}
  ha.terminationGracePeriod: {type: duration, unit: seconds, default: 60, minimum: 30, maximum: 300, scope: deployment, environmentScope: all, secretClassification: public, reload: restart}
  ha.preStopDrainDelay: {type: duration, unit: seconds, default: 15, minimum: 1, maximum: 120, scope: deployment, environmentScope: all, secretClassification: public, reload: restart}
  etcd.maxPendingProposals: {type: integer, unit: proposals, default: 64, minimum: 1, maximum: 4096, scope: control-plane, environmentScope: all, secretClassification: public, reload: restart}
  etcd.storageSlowBlocksPublication: {type: boolean, unit: boolean, default: true, minimum: false, maximum: true, scope: control-plane, environmentScope: all, secretClassification: public, reload: restart}
  etcd.quorumRequiredForPublication: {type: boolean, unit: boolean, default: true, minimum: false, maximum: true, scope: control-plane, environmentScope: all, secretClassification: public, reload: restart}
  restore.requireExactActiveRevision: {type: boolean, unit: boolean, default: true, minimum: false, maximum: true, scope: control-plane, environmentScope: all, secretClassification: public, reload: restart}
  restore.rejectWildcardRoutes: {type: boolean, unit: boolean, default: true, minimum: false, maximum: true, scope: control-plane, environmentScope: all, secretClassification: public, reload: restart}
  gateway.rateLimits.r2bLakeWrite.count: &r2bCount {type: integer, unit: requests, default: null, minimum: 1, maximum: null, scope: data-plane, environmentScope: installation, secretClassification: public, reload: publication}
  gateway.rateLimits.r2bLakeWrite.timeWindowSeconds: &r2bTimeWindowSeconds {type: integer, unit: seconds, default: null, minimum: 1, maximum: null, scope: data-plane, environmentScope: installation, secretClassification: public, reload: publication}
  gateway.rateLimits.r2bLakeWrite.key: &r2bKey {type: string, unit: APISIX variable, default: null, minimum: null, maximum: null, scope: data-plane, environmentScope: installation, secretClassification: public, reload: publication}
  gateway.rateLimits.r2bHandoffWrite.count: *r2bCount
  gateway.rateLimits.r2bHandoffWrite.timeWindowSeconds: *r2bTimeWindowSeconds
  gateway.rateLimits.r2bHandoffWrite.key: *r2bKey
  gateway.rateLimits.r2bSemanticGet.count: *r2bCount
  gateway.rateLimits.r2bSemanticGet.timeWindowSeconds: *r2bTimeWindowSeconds
  gateway.rateLimits.r2bSemanticGet.key: *r2bKey
  gateway.rateLimits.r2bSemanticBatch.count: *r2bCount
  gateway.rateLimits.r2bSemanticBatch.timeWindowSeconds: *r2bTimeWindowSeconds
  gateway.rateLimits.r2bSemanticBatch.key: *r2bKey
  gateway.rateLimits.r2bPublication.count: *r2bCount
  gateway.rateLimits.r2bPublication.timeWindowSeconds: *r2bTimeWindowSeconds
  gateway.rateLimits.r2bPublication.key: *r2bKey
  gateway.rateLimits.semanticSearch.count: *r2bCount
  gateway.rateLimits.semanticSearch.timeWindowSeconds: *r2bTimeWindowSeconds
  gateway.rateLimits.semanticSearch.key: *r2bKey
  gateway.rateLimits.semanticSearchBatch.count: *r2bCount
  gateway.rateLimits.semanticSearchBatch.timeWindowSeconds: *r2bTimeWindowSeconds
  gateway.rateLimits.semanticSearchBatch.key: *r2bKey
  gateway.authority.store: &gatewaySqlite {type: path, unit: SQLite file, default: null, minimum: null, maximum: null, scope: data-plane, environmentScope: installation, secretClassification: private, reload: restart}
  gateway.iamAdapter.store: *gatewaySqlite
  gateway.authority.configFile: &gatewayPrivateFile {type: path, unit: file reference, default: null, minimum: null, maximum: null, scope: data-plane, environmentScope: installation, secretClassification: private, reload: restart}
  gateway.iamAdapter.configFile: *gatewayPrivateFile
  gateway.authority.manifestFile: *gatewayPrivateFile
  gateway.iamAdapter.profileFile: *gatewayPrivateFile
  gateway.authority.serverCertFile: *gatewayPrivateFile
  gateway.authority.serverKeyFile: &gatewayKeyRef {type: path, unit: private key reference, default: null, minimum: null, maximum: null, scope: data-plane, environmentScope: installation, secretClassification: secret-reference, reload: restart}
  gateway.authority.clientCaFile: *gatewayPrivateFile
  gateway.iamAdapter.serverCertFile: *gatewayPrivateFile
  gateway.iamAdapter.serverKeyFile: *gatewayKeyRef
  gateway.iamAdapter.clientCaFile: *gatewayPrivateFile
  # Both credential paths must resolve to regular files of at most 4096 bytes, including any terminator.
  gateway.authority.delegationKeyFile: &gatewayCredentialFile {type: path, unit: credential file reference, default: null, minimum: null, maximum: null, scope: data-plane, environmentScope: installation, secretClassification: secret-reference, reload: restart}
  gateway.iamAdapter.secretFile: *gatewayCredentialFile
  # On the IAM adapter, the probe principal must differ from gatewayTlsPrincipal.
  gateway.iamAdapter.probePrincipal: &gatewayProbePrincipal {type: string, unit: verified TLS principal, default: null, minimum: null, maximum: null, scope: data-plane, environmentScope: installation, secretClassification: private, reload: restart}
  gateway.authority.probePrincipal: *gatewayProbePrincipal
