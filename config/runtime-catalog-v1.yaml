apiVersion: ouf.trieste.it/v1
kind: GatewayRuntimeConfigurationCatalog
version: "1.0"
entries:
  publication.batchSize:
    type: integer
    unit: objects
    default: 50
    minimum: 1
    maximum: 1000
    scope: control-plane
    reload: restart
  publication.convergenceTimeout:
    type: duration
    unit: seconds
    default: 30
    minimum: 1
    maximum: 120
    scope: control-plane
    reload: restart
  request.maxBytesCeiling:
    type: integer
    unit: bytes
    default: 10485760
    minimum: 1
    maximum: 10485760
    scope: data-plane
    reload: publication
  request.timeoutCeiling:
    type: integer
    unit: seconds
    default: 60
    minimum: 1
    maximum: 60
    scope: data-plane
    reload: publication
  rateLimit.defaultPerMinute:
    type: integer
    unit: requests/minute
    default: 100
    minimum: 1
    maximum: 10000
    scope: data-plane
    reload: publication
